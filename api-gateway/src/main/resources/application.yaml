spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-route
              uri: lb://auth-service
              predicates:
                - Path=/auth/**, /oauth2/**, /login/oauth2/**
              filters:
                - StripPrefix=0
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

server:
  port: 4000

auth:
  service:
    url: ${AUTH_SERVICE_URL}